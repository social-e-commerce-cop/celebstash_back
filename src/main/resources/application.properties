# Server Configuration
# Dynamically binds to Render's $PORT while falling back to 8080 for local development
server.port=${PORT:8080}
spring.application.name=celebstash-backend

# Database Configuration (PostgreSQL)
# Supports standard Spring environment variables as well as cloud-standard DATABASE_* variables.
#
# Neon (managed Postgres) requires TLS, so its JDBC URL must carry ?sslmode=require, e.g.
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<endpoint>.<region>.aws.neon.tech/neondb?sslmode=require
# Note: Neon's own connection strings also include channel_binding=require. That is a libpq
# parameter the PostgreSQL JDBC driver does not understand — omit it from the JDBC URL.
# Credentials always come from the environment; never commit them here.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/celebstash}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:123}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
# Stated explicitly so startup does not depend on a metadata round-trip to infer the dialect —
# against a remote endpoint that probe can time out and abort the whole context.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# schema.sql is a patch script for an already-created schema: it ALTERs existing tables and
# backfills columns. Spring runs schema.sql before Hibernate by default, which works only on a
# database that already has the tables — against a brand-new database (a fresh Neon branch) its
# unguarded UPDATE statements fail with "relation posts does not exist" and startup aborts.
# Deferring datasource initialization lets Hibernate create the schema first, then applies the
# patch script, which is the order the script was written for.
spring.jpa.defer-datasource-initialization=${SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION:true}

# Connection pool (HikariCP).
# Sized for a managed Postgres endpoint such as Neon, whose compute autosuspends after a period
# of inactivity and drops idle connections: max-lifetime/keepalive stay below that window so the
# pool retires connections itself instead of handing out a dead one, and the longer
# connection-timeout absorbs a cold start (a suspended compute can take several seconds to wake).
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:120000}
spring.datasource.hikari.keepalive-time=${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:120000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:300000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}

# Driver-level timeouts (seconds) — these are what stop a request hanging forever.
# hikari.connection-timeout only bounds borrowing a connection from the pool; it does NOT bound
# waiting for the server to answer. When a managed endpoint such as Neon autosuspends, the TCP
# socket stays open from the client's side, so without socketTimeout the JDBC driver blocks in a
# socket read indefinitely and every request thread wedges. socketTimeout makes the dead
# connection fail fast so Hikari can evict it and hand out a fresh one.
# socketTimeout is generous because Hibernate's ddl-auto=update introspects column metadata for
# every table at startup, which is a long round-trip-heavy scan against a remote endpoint.
# connectTimeout allows for a suspended Neon compute cold-starting on the first connection.
spring.datasource.hikari.data-source-properties.socketTimeout=${DB_SOCKET_TIMEOUT_SECONDS:120}
spring.datasource.hikari.data-source-properties.connectTimeout=${DB_CONNECT_TIMEOUT_SECONDS:30}
spring.datasource.hikari.data-source-properties.loginTimeout=${DB_LOGIN_TIMEOUT_SECONDS:30}
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}

# JWT Security Configuration (512-bit Secret Key)
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:6B597032733575383732733575383732733575383732733575383732733575383732733575383732733575383732733575383732733575383732733575383732}}
app.jwt.access-token.expiration=${APP_JWT_ACCESS_TOKEN_EXPIRATION:86400000}
app.jwt.refresh-token.expiration=${APP_JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# OTP & Rate Limiting Configuration
app.otp.expiration=${APP_OTP_EXPIRATION:600000}
app.otp.max-attempts=${APP_OTP_MAX_ATTEMPTS:5}
app.otp.rate-limit.per-minute=${APP_OTP_RATE_LIMIT_PER_MINUTE:3}
app.otp.rate-limit.per-day=${APP_OTP_RATE_LIMIT_PER_DAY:10}
# Optional local-development master OTP. MUST stay blank in any deployed environment:
# a code that is accepted for every identifier allows anyone to complete a password reset
# for any account, including ADMIN.
app.otp.dev-master-code=${APP_OTP_DEV_MASTER_CODE:}

# Seed Account Configuration (used only when the account does not already exist).
# Leave blank to have a random password generated and logged once at startup.
app.seed.admin-email=${APP_SEED_ADMIN_EMAIL:karabogretta@gmail.com}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.demo-password=${APP_SEED_DEMO_PASSWORD:}

# Twilio SMS Configuration
twilio.accountSid=${TWILIO_ACCOUNT_SID:AC00000000000000000000000000000000}
twilio.authToken=${TWILIO_AUTH_TOKEN:00000000000000000000000000000000}
twilio.phoneNumber=${TWILIO_PHONE_NUMBER:+15005550006}

# Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
# Credentials come from the environment only. This file is tracked by git — a Gmail app
# password committed here is a published secret. Set SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD
# in .env.local (git-ignored) for local runs, or in the host's environment for deployments.
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# Spring Boot Actuator Configuration (Health Checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true