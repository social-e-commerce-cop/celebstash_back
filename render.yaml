services:
  - type: web
    name: celebstash-backend
    runtime: docker
    plan: free
    branch: nadette
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Readiness reflects "started + database reachable". The aggregate /actuator/health also
    # includes Redis and mail, which are optional here and would report DOWN (503) on a service
    # with no Redis attached — that would fail the platform health check for no real reason.
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: PORT
        value: 8080

      # Startup cost control. Spring Boot binds the HTTP port only after the application context
      # finishes refreshing, and ddl-auto=update makes Hibernate introspect column metadata for
      # every table before that happens. Against a remote database that scan takes long enough
      # that the platform's port scan times out and the deploy is killed before it ever listens.
      # The schema is already created in Neon, so skip both the scan and the patch script here.
      # Set ddl-auto back to "update" temporarily when a deploy must apply new entity columns.
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: none
      - key: SPRING_SQL_INIT_MODE
        value: never

      # Database: Neon Postgres.
      #
      # Set these three in the Render dashboard (Environment tab). Do NOT also link a Render
      # PostgreSQL instance to this service: Render injects DATABASE_URL for a linked database,
      # which is a *different* database and would give the deployed app different data from the
      # one used locally. docker-entrypoint.sh now prefers SPRING_DATASOURCE_URL and ignores
      # DATABASE_URL, but leaving both configured is confusing — unlink the Render database.
      #
      # Format (note ?sslmode=require; omit Neon's channel_binding, which the JDBC driver rejects):
      #   jdbc:postgresql://<endpoint>.<region>.aws.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: JWT_SECRET
        generateValue: true
      - key: APP_JWT_SECRET
        fromEnvVar: JWT_SECRET
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      - key: SPRING_MAIL_PORT
        value: 587
      # Required: OTP delivery for signup. SMTP credentials are no longer hardcoded in
      # application.properties, so signup verification emails fail unless these are set here.
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

      # Seed accounts. DataInitializer only creates these when they do not already exist; if
      # left unset it generates a random password and logs it once. Set them explicitly so the
      # deployed environment has known, controlled credentials.
      - key: APP_SEED_ADMIN_EMAIL
        sync: false
      - key: APP_SEED_ADMIN_PASSWORD
        sync: false
      - key: APP_SEED_DEMO_PASSWORD
        sync: false
